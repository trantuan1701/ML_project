name: ML_proj_onnx
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - numpy>=1.23,<3
  - pandas>=2.2
  - scipy>=1.11
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - onnx>=1.16
  - onnxruntime>=1.18
  - pip

  - pip:
      - python-dotenv
      - xgboost>=2.0
      - lightgbm>=4.3
      - optuna>=3.6
      - streamlit>=1.36
      - openpyxl>=3.1
      - requests>=2.31
      - joblib>=1.4
      - tqdm>=4.66
      - skl2onnx>=1.17
      - onnxmltools
      - hummingbird-ml>=0.4.9
